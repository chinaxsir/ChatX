name: Build All Platforms

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-ios-trollstore:
    name: 构建 iOS 巨魔 TrollStore IPA
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 安装系统依赖（ldid 伪签名 / CocoaPods）
        run: brew install ldid cocoapods

      - name: 安装前端依赖
        working-directory: agent-app
        run: npm install

      - name: 初始化 Tauri iOS 工程
        working-directory: agent-app
        run: npx tauri ios init

      - name: 构建前端（dist）
        working-directory: agent-app
        run: npm run build

      - name: 强制切换 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: 彻底移除 Tauri 构建脚本 Phase
        run: |
          # 查找所有脚本文件，并删除包含 tauri 构建指令的文件
          find agent-app/src-tauri/gen/apple -name "Script-*.sh" | while read -r script; do
            if grep -q "tauri ios xcode-script" "$script"; then
              echo "删除脚本: $script"
              rm -f "$script"
            fi
          done

      - name: 编译 .app
        working-directory: agent-app/src-tauri/gen/apple
        env:
          RUST_BACKTRACE: full
        run: |
          set -e
          # 增加 -skipUnavailableActions 尝试绕过未配置的 scheme 错误
          xcodebuild build \
            -project agent-app.xcodeproj \
            -scheme agent-app_iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -allowProvisioningUpdates

      - name: ldid 伪签名并打包 IPA
        run: |
          set -e
          APP=$(find agent-app/src-tauri -name "*.app" -path "*Release-iphoneos*" 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find agent-app -name "*.app" -type d 2>/dev/null | head -1)
          fi
          echo "产物 .app: $APP"
          APPNAME=$(basename "$APP" .app)
          EXEC=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP/Info.plist")
          echo "App 名: $APPNAME | 可执行文件: $EXEC"
          rm -rf Payload
          mkdir Payload
          cp -r "$APP" "Payload/"
          ldid -S "Payload/$APPNAME.app/$EXEC"
          zip -r FrapiAI_TrollStore.ipa Payload
          ls -lh FrapiAI_TrollStore.ipa

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: FrapiAI_TrollStore_IPA
          path: FrapiAI_TrollStore.ipa
          retention-days: 30
