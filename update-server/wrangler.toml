name = "frapi-updates"
compatibility_date = "2024-12-01"
pages_build_output_dir = "."

# D1 数据库（版本元数据 + 客户端 check-in 日志）
[[d1_databases]]
binding = "DB"
database_name = "frapi-updates-db"
database_id = "b6ee385e-8e5b-429c-951c-2693d53f772c"

# R2 存储桶（安装包二进制文件）
[[r2_buckets]]
binding = "FILES"
bucket_name = "frapi-updates-files"

# 环境变量
[vars]
ADMIN_PASSWORD = "frapi-admin-2026"  # 部署后请修改
JWT_SECRET = "frapi-jwt-secret-2026" # 部署后请修改
