<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frapi AI 更新管理后台</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app"></div>
<script>
// ===== Frapi AI 更新管理后台 SPA =====
const API_BASE = '';
let token = sessionStorage.getItem('admin_token') || '';

// ===== 工具函数 =====
async function api(path, options = {}) {
  const headers = { ...options.headers };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  if (options.body && !(options.body instanceof FormData)) {
    headers['Content-Type'] = 'application/json';
    options.body = JSON.stringify(options.body);
  }
  const res = await fetch(API_BASE + path, { ...options, headers });
  if (res.status === 401) {
    token = '';
    sessionStorage.removeItem('admin_token');
    renderLogin();
    throw new Error('未登录');
  }
  return res;
}
async function apiJSON(path, options) {
  const res = await api(path, options);
  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch { data = {}; }
  if (!res.ok) throw new Error(data.error || `请求失败（HTTP ${res.status}）`);
  return data;
}
function fmtTime(s) {
  if (!s) return '—';
  try { return new Date(s.replace(' ', 'T') + 'Z').toLocaleString('zh-CN'); }
  catch { return s; }
}
function esc(s) { return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ===== 登录视图 =====
function renderLogin() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <h1>Frapi AI 更新管理</h1>
        <p>请输入管理密码登录</p>
        <div id="login-error" class="login-error" style="display:none"></div>
        <input type="password" id="pwd" placeholder="管理密码" autofocus
          onkeydown="if(event.key==='Enter')doLogin()">
        <button onclick="doLogin()">登 录</button>
      </div>
    </div>`;

  window.doLogin = async () => {
    const pwd = document.getElementById('pwd').value;
    const err = document.getElementById('login-error');
    try {
      const data = await apiJSON('/api/auth', { method: 'POST', body: { password: pwd } });
      token = data.token;
      sessionStorage.setItem('admin_token', token);
      renderApp();
    } catch (e) {
      err.textContent = e.message;
      err.style.display = 'block';
    }
  };
}

// ===== 主应用 =====
function renderApp() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="app-header">
      <h1>Frapi AI 更新管理</h1>
      <nav>
        <button class="nav-btn" data-view="dashboard" onclick="switchView('dashboard')">仪表盘</button>
        <button class="nav-btn" data-view="versions" onclick="switchView('versions')">版本管理</button>
        <button class="nav-btn" data-view="clients" onclick="switchView('clients')">客户端信息</button>
        <button class="nav-btn" data-view="settings" onclick="switchView('settings')">设置</button>
        <button class="nav-btn danger" onclick="doLogout()">退出</button>
      </nav>
    </div>
    <div class="container" id="view-container">加载中…</div>`;

  switchView('dashboard');
}

window.switchView = function(view) {
  document.querySelectorAll('.nav-btn[data-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  const c = document.getElementById('view-container');
  c.innerHTML = '<p>加载中…</p>';
  if (view === 'dashboard') renderDashboard(c);
  else if (view === 'versions') renderVersions(c);
  else if (view === 'clients') renderClients(c);
  else if (view === 'settings') renderSettings(c);
};

window.doLogout = function() {
  token = '';
  sessionStorage.removeItem('admin_token');
  renderLogin();
};

// ===== 仪表盘 =====
async function renderDashboard(c) {
  try {
    const s = await apiJSON('/api/stats');
    c.innerHTML = `
      <div class="stats-grid">
        <div class="stat-card green">
          <div class="label">最新版本</div>
          <div class="value">${esc(s.latest_version)}</div>
          <div class="sub">${esc(s.latest_pub_date?.slice(0,10))}</div>
        </div>
        <div class="stat-card blue">
          <div class="label">总版本数</div>
          <div class="value">${s.versions}</div>
        </div>
        <div class="stat-card">
          <div class="label">检查更新次数</div>
          <div class="value">${s.checkins}</div>
          <div class="sub">${s.update_available} 次有可用更新</div>
        </div>
        <div class="stat-card yellow">
          <div class="label">总下载量</div>
          <div class="value">${s.downloads}</div>
        </div>
      </div>

      <div class="card">
        <h2>客户端版本分布</h2>
        ${s.version_distribution.length ? `
        <table><thead><tr><th>客户端版本</th><th>检查次数</th><th>占比</th></tr></thead><tbody>
          ${s.version_distribution.map(v => `
            <tr><td>v${esc(v.client_version)}</td><td>${v.count}</td>
            <td>${(v.count / s.checkins * 100).toFixed(1)}%</td></tr>
          `).join('')}
        </tbody></table>` : '<p style="color:var(--text-dim)">暂无数据</p>'}
      </div>

      <div class="card">
        <h2>最近检查更新记录</h2>
        ${s.recent_checkins.length ? `
        <table><thead><tr><th>客户端版本</th><th>平台</th><th>架构</th><th>有更新</th><th>时间</th></tr></thead><tbody>
          ${s.recent_checkins.map(r => `
            <tr>
              <td>v${esc(r.client_version)}</td>
              <td>${esc(r.target)}</td>
              <td>${esc(r.arch)}</td>
              <td>${r.has_update ? '<span class="badge badge-green">是</span>' : '<span class="badge badge-yellow">否</span>'}</td>
              <td>${fmtTime(r.created_at)}</td>
            </tr>
          `).join('')}
        </tbody></table>` : '<p style="color:var(--text-dim)">暂无记录</p>'}
      </div>`;
  } catch (e) {
    c.innerHTML = `<div class="card"><p style="color:var(--red)">加载失败: ${esc(e.message)}</p></div>`;
  }
}

// ===== 版本管理 =====
async function renderVersions(c) {
  try {
    const data = await apiJSON('/api/versions');
    c.innerHTML = `
      <div class="card">
        <h2>发布新版本</h2>
        <div class="form-row">
          <div class="form-group">
            <label>版本号 *</label>
            <input type="text" id="new-version" placeholder="如 0.3.0">
          </div>
          <div class="form-group">
            <label>发布时间 *</label>
            <input type="datetime-local" id="new-pubdate">
          </div>
        </div>
        <div class="form-group">
          <label>更新说明</label>
          <textarea id="new-notes" placeholder="本次更新内容…"></textarea>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="new-latest" checked> 设为最新版本</label>
        </div>
        <button class="btn btn-primary" onclick="createVersion()">创建版本</button>
      </div>

      <div class="card">
        <h2>已发布版本</h2>
        <div id="versions-list"></div>
      </div>

      <div class="card">
        <h2>上传安装包</h2>
        <div class="form-group">
          <label>关联版本</label>
          <select id="upload-version"></select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>平台标识 *</label>
            <select id="upload-platform">
              <option value="windows-x86_64">Windows x86_64 (64位)</option>
              <option value="windows-i686">Windows i686 (32位)</option>
              <option value="windows-aarch64">Windows ARM64</option>
              <option value="darwin-x86_64">macOS Intel</option>
              <option value="darwin-aarch64">macOS Apple Silicon</option>
              <option value="linux-x86_64">Linux x86_64</option>
              <option value="linux-aarch64">Linux ARM64</option>
            </select>
          </div>
          <div class="form-group">
            <label>文件名（可选）</label>
            <input type="text" id="upload-filename" placeholder="留空则用上传文件原名">
          </div>
        </div>
        <div class="form-group">
          <label>签名内容 (.sig 文件全文) *</label>
          <textarea id="upload-sig" placeholder="把 .sig 文件内容整段粘贴到这里"></textarea>
        </div>
        <div class="upload-area" id="drop-zone">
          <p>拖放安装包文件到此处，或</p>
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('upload-file').click()">选择文件</button>
          <input type="file" id="upload-file" style="display:none">
          <p id="file-info" style="color:var(--brand-hover)"></p>
        </div>
        <div style="margin-top:12px">
          <button class="btn btn-primary" onclick="uploadAsset()">上传</button>
        </div>
      </div>`;

    const sel = document.getElementById('upload-version');
    data.versions.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.id;
      opt.textContent = `v${v.version}${v.is_latest ? ' (最新)' : ''}`;
      sel.appendChild(opt);
    });

    renderVersionsList(data.versions);

    const dz = document.getElementById('drop-zone');
    const fileInput = document.getElementById('upload-file');
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) {
        document.getElementById('file-info').textContent =
          `已选: ${fileInput.files[0].name} (${(fileInput.files[0].size/1024/1024).toFixed(2)} MB)`;
      }
    });
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', e => {
      e.preventDefault(); dz.classList.remove('dragover');
      if (e.dataTransfer.files[0]) {
        fileInput.files = e.dataTransfer.files;
        fileInput.dispatchEvent(new Event('change'));
      }
    });
  } catch (e) {
    c.innerHTML = `<div class="card"><p style="color:var(--red)">加载失败: ${esc(e.message)}</p></div>`;
  }
}

function renderVersionsList(versions) {
  const el = document.getElementById('versions-list');
  if (!versions.length) { el.innerHTML = '<p style="color:var(--text-dim)">暂无版本</p>'; return; }
  el.innerHTML = versions.map(v => `
    <div class="version-item">
      <div class="header">
        <div>
          <span class="ver">v${esc(v.version)}</span>
          ${v.is_latest ? '<span class="badge badge-green" style="margin-left:8px">最新</span>' : ''}
          <span class="badge badge-blue" style="margin-left:8px">${v.asset_count} 个安装包</span>
          <span style="color:var(--text-dim);font-size:12px;margin-left:8px">${esc(v.pub_date?.slice(0,10))}</span>
        </div>
        <div class="actions">
          ${!v.is_latest ? `<button class="btn btn-ghost btn-sm" onclick="setLatest(${v.id})">设为最新</button>` : ''}
          <button class="btn btn-danger btn-sm" onclick="deleteVersion(${v.id}, '${esc(v.version)}')">删除</button>
        </div>
      </div>
      ${v.notes ? `<div class="notes">${esc(v.notes)}</div>` : ''}
      <div class="assets">
        ${(v.assets||[]).map(a => `
          <span class="asset-chip">
            ${esc(a.platform)} · ${esc(a.filename)}
            <span class="dl">↓${a.download_count}</span>
            <button onclick="deleteAsset(${a.id})" style="background:none;border:none;color:var(--red);cursor:pointer;padding:0 2px">✕</button>
          </span>
        `).join('')}
      </div>
    </div>`).join('');
}

window.createVersion = async function() {
  const version = document.getElementById('new-version').value.trim();
  const pubdate = document.getElementById('new-pubdate').value;
  const notes = document.getElementById('new-notes').value.trim();
  const isLatest = document.getElementById('new-latest').checked;
  if (!version || !pubdate) { alert('请填写版本号和发布时间'); return; }
  const pubDate = new Date(pubdate).toISOString();
  try {
    await apiJSON('/api/versions', {
      method: 'POST', body: { version, notes, pub_date: pubDate, is_latest: isLatest }
    });
    alert('版本创建成功');
    switchView('versions');
  } catch (e) { alert('创建失败: ' + e.message); }
};

window.setLatest = async function(id) {
  try {
    await apiJSON(`/api/versions/${id}`, { method: 'PUT', body: { is_latest: true } });
    switchView('versions');
  } catch (e) { alert('设置失败: ' + e.message); }
};

window.deleteVersion = async function(id, ver) {
  if (!confirm(`确定删除版本 v${ver}？关联的安装包也将删除。`)) return;
  try {
    await apiJSON(`/api/versions/${id}`, { method: 'DELETE' });
    switchView('versions');
  } catch (e) { alert('删除失败: ' + e.message); }
};

window.uploadAsset = async function() {
  const versionId = document.getElementById('upload-version').value;
  const platform = document.getElementById('upload-platform').value;
  const signature = document.getElementById('upload-sig').value.trim();
  const filename = document.getElementById('upload-filename').value.trim();
  const fileInput = document.getElementById('upload-file');
  if (!fileInput.files[0]) { alert('请选择安装包文件'); return; }
  if (!signature) { alert('请粘贴 .sig 签名内容'); return; }
  const fd = new FormData();
  fd.append('file', fileInput.files[0]);
  fd.append('signature', signature);
  fd.append('platform', platform);
  fd.append('version_id', versionId);
  if (filename) fd.append('filename', filename);
  try {
    await apiJSON('/api/upload', { method: 'POST', body: fd });
    alert('上传成功');
    switchView('versions');
  } catch (e) { alert('上传失败: ' + e.message); }
};

window.deleteAsset = async function(id) {
  if (!confirm('确定删除此安装包？')) return;
  try {
    await apiJSON(`/api/assets/${id}`, { method: 'DELETE' });
    switchView('versions');
  } catch (e) { alert('删除失败: ' + e.message); }
};

// ===== 设置页面 =====
function renderSettings(c) {
  c.innerHTML = `
    <div class="card">
      <h2>修改管理密码</h2>
      <div class="form-group">
        <label>原密码</label>
        <input type="password" id="old-pwd">
      </div>
      <div class="form-group">
        <label>新密码</label>
        <input type="password" id="new-pwd">
      </div>
      <button class="btn btn-primary" onclick="doChangePwd()">确认修改</button>
    </div>`;

  window.doChangePwd = async () => {
    const oldP = document.getElementById('old-pwd').value;
    const newP = document.getElementById('new-pwd').value;
    if (!oldP || !newP) { alert('请填写密码'); return; }
    try {
      await apiJSON('/api/auth', { method: 'PATCH', body: { oldPassword: oldP, newPassword: newP } });
      alert('密码已更新！');
      document.getElementById('old-pwd').value = '';
      document.getElementById('new-pwd').value = '';
    } catch (e) { alert(e.message); }
  };
}

// ===== 客户端信息 =====
async function renderClients(c) {
  try {
    const s = await apiJSON('/api/stats');
    const total = s.checkins || 1;
    c.innerHTML = `
      <div class="card">
        <h2>最近 30 条检查记录</h2>
        ${s.recent_checkins.length ? `
        <table><thead><tr><th>客户端版本</th><th>平台</th><th>有更新</th><th>时间</th></tr></thead><tbody>
          ${s.recent_checkins.map(r => `
            <tr>
              <td>v${esc(r.client_version)}</td>
              <td>${esc(r.target)}</td>
              <td>${r.has_update ? '<span class="badge badge-green">是</span>' : '<span class="badge badge-yellow">否</span>'}</td>
              <td>${fmtTime(r.created_at)}</td>
            </tr>
          `).join('')}
        </tbody></table>` : '<p style="color:var(--text-dim)">暂无记录</p>'}
      </div>`;
  } catch (e) { c.innerHTML = `<div class="card"><p style="color:var(--red)">加载失败: ${esc(e.message)}</p></div>`; }
}

// ===== 启动 =====
if (token) {
  apiJSON('/api/stats').then(() => renderApp()).catch(() => renderLogin());
} else {
  renderLogin();
}
</script>
</body>
</html>
